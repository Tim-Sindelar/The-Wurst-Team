<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home · Study Spaces</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../base.css">
  <script src="../base.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
        <h1 class="app-header__brand t-heading">Academic Study Spaces</h1>
        <div class="row">
          <button class="icon-button theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to light theme">
            <i class="icon i-sun"></i><i class="icon i-moon"></i>
          </button>
          <a class="icon-button" href="06-profile.html" aria-label="Profile">
            <span class="avatar" aria-hidden="true">AM</span>
          </a>
        </div>
    </header>
    <main class="app__main">
      <div class="sticky-top">
        <label class="search">
          <i class="icon i-search"></i>
          <span class="sr-only">Search study spaces</span>
          <input type="search" placeholder="Search study spaces">
        </label>
      </div>

      <a class="card card--stripe is-reserved" href="03-reservation.html" data-if-state="reserved" hidden>
        <div class="row">
          <div class="grow stack stack--tight">
            <p class="t-title">Seat <span data-seat>14</span> · HG E 41</p>
            <p class="t-small t-muted">Reserved · tap to check in</p>
          </div>
          <i class="icon i-chevron-right"></i>
        </div>
      </a>
      <a class="card card--stripe is-yours" href="05-session.html" data-if-state="session" hidden>
        <div class="row">
          <div class="grow stack stack--tight">
            <p class="t-title">Seat <span data-seat>14</span> · HG E 41</p>
            <p class="t-small t-muted">In session · tap to open</p>
          </div>
          <i class="icon i-chevron-right"></i>
        </div>
      </a>

      <ul class="scroller" aria-label="Recent and favourite study spaces">
        <li>
          <article class="card space-card">
            <div class="row row--spread">
              <h2 class="t-title grow"><a class="space-card__link" href="02-seat-arrangement.html">HG E 41</a></h2>
              <button class="icon-button star" type="button" data-favourite aria-pressed="true" aria-label="Favourite HG E 41">
                <i class="icon i-star"></i><i class="icon i-star-fill"></i>
              </button>
            </div>
            <span class="avail avail--high">12 free</span>
          </article>
        </li>
        <li>
          <article class="card space-card">
            <div class="row row--spread">
              <h2 class="t-title grow"><a class="space-card__link" href="02-seat-arrangement.html">CAB E 11</a></h2>
              <button class="icon-button star" type="button" data-favourite aria-pressed="true" aria-label="Favourite CAB E 11">
                <i class="icon i-star"></i><i class="icon i-star-fill"></i>
              </button>
            </div>
            <span class="avail avail--mid">3 free · almost full</span>
          </article>
        </li>
        <li>
          <article class="card space-card">
            <div class="row row--spread">
              <h2 class="t-title grow"><a class="space-card__link" href="02-seat-arrangement.html">Main Library Reading Room</a></h2>
              <button class="icon-button star" type="button" data-favourite aria-pressed="false" aria-label="Favourite Main Library Reading Room">
                <i class="icon i-star"></i><i class="icon i-star-fill"></i>
              </button>
            </div>
            <span class="avail avail--none">0 free · full</span>
          </article>
        </li>
      </ul>

      <h2 class="sr-only">Campus map</h2>
      <div class="placeholder placeholder--fill" role="img" aria-label="Placeholder: the campus map goes here">
        <i class="icon icon--lg i-map"></i>
        <p>Campus map goes here</p>
      </div>
    </main>
  </div>
</body>
</html>
