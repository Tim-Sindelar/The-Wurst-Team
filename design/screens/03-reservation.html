<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservation · Study Spaces</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../base.css">
  <script src="../base.js"></script>
</head>
<body data-sets-state="reserved">
  <div class="app">
    <header class="app-header">
      <a class="icon-button" href="02-seat-arrangement.html" aria-label="Back to the seat map"><i class="icon i-back"></i></a>
      <h1 class="app-header__title">Your reservation</h1>
      <button class="icon-button theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to light theme">
        <i class="icon i-sun"></i><i class="icon i-moon"></i>
      </button>
    </header>

    <main class="app__main">
      <section class="card card--stripe is-reserved" aria-labelledby="seat-title">
        <div class="row row--spread">
          <h2 class="t-heading" id="seat-title">Seat 14</h2>
          <span class="chip chip--plain is-reserved">Reserved</span>
        </div>
        <p class="row t-muted"><i class="icon icon--sm i-pin"></i> HG E 41 · Main building</p>
      </section>

      <section class="card timer-card" aria-labelledby="timer-label">
        <p class="t-label" id="timer-label">Check in within</p>
        <p class="t-timer" data-countdown="552" data-total="600">09:12</p>
        <div class="progress" role="progressbar" aria-labelledby="timer-label" aria-valuemin="0" aria-valuemax="600" aria-valuenow="552">
          <div class="progress__bar" style="--value: 92%"></div>
        </div>
        <p class="t-small t-muted">Scan the QR code on your table when you arrive. If the time runs out, the seat is released for others.</p>
      </section>
    </main>

    <div class="app__actions">
      <a class="btn btn--primary btn--block" href="04-qr-scan.html"><i class="icon i-qr"></i> Check in</a>
      <button class="btn btn--secondary btn--block" type="button" data-sheet-open="sheet-cancel">Cancel reservation</button>
    </div>
  </div>

  <dialog class="sheet" id="sheet-cancel" aria-labelledby="sheet-cancel-title">
    <div class="sheet__grab"></div>
    <button class="icon-button sheet__close" type="button" data-sheet-close aria-label="Close"><i class="icon i-close"></i></button>
    <form class="sheet__body" method="dialog">
      <h2 class="t-title" id="sheet-cancel-title">Cancel reservation?</h2>
      <p class="t-muted">Seat 14 becomes free for others right away.</p>
      <div class="sheet__actions">
        <button class="btn btn--secondary" value="cancel">Keep seat</button>
        <a class="btn btn--danger" href="01-home.html" data-clears-state>Cancel reservation</a>
      </div>
    </form>
  </dialog>
</body>
</html>
