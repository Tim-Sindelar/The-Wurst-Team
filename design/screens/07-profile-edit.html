<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit profile · Study Spaces</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../base.css">
  <script src="../base.js"></script>
</head>
<body>
  <div class="app app--profile-editor">
    <header class="app-header">
      <a class="icon-button" href="06-profile.html" aria-label="Back to profile"><i class="icon i-back"></i></a>
      <h1 class="app-header__title">Edit profile</h1>
      <a class="icon-button has-badge" href="08-friends.html#requests" aria-label="Requests, 2 waiting"><i class="icon i-bell" aria-hidden="true"></i><span class="badge" aria-hidden="true">2</span></a>
      <button class="icon-button theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to light theme"><i class="icon i-sun"></i><i class="icon i-moon"></i></button>
    </header>
    <main class="app__main">
      <form class="card" id="profile-edit-form" action="06-profile.html">
        <label class="field"><span class="field__label">Display name</span><input class="input" value="Anna Meier" autocomplete="nickname" maxlength="80" required></label>
        <p class="t-small">Profile photo</p>
        <button class="photo-crop" type="button" aria-label="Position profile photo"><span class="t-heading">AM</span></button>
        <p class="t-small t-muted">Drag to position your photo. Use zoom to get the right fit.</p>
        <div class="field">
          <label class="field__label" for="photo-zoom">Zoom · 1.0×</label>
          <div class="row">
            <button class="icon-button" type="button" aria-label="Zoom out" disabled><i class="icon i-minus" aria-hidden="true"></i></button>
            <input class="grow" id="photo-zoom" type="range" min="1" max="3" step="0.05" value="1" aria-label="Photo zoom">
            <button class="icon-button" type="button" aria-label="Zoom in"><i class="icon i-plus" aria-hidden="true"></i></button>
          </div>
        </div>
        <button class="btn btn--quiet" type="button">Reset position</button>
        <button class="btn btn--secondary" type="button">Change photo</button>
        <button class="btn btn--quiet" type="button">Remove photo</button>
        <p class="t-small t-muted">JPEG, PNG or WebP, up to 12 MB. Your photo and name change when you save.</p>
      </form>
    </main>
    <div class="app__actions">
      <button class="btn btn--primary btn--block" type="submit" form="profile-edit-form">Save changes</button>
      <a class="btn btn--quiet" href="06-profile.html">Cancel</a>
    </div>
    <nav class="bottom-nav" aria-label="Main navigation">
      <a class="bottom-nav__link" href="01-home.html"><i class="icon i-home" aria-hidden="true"></i><span>Home</span></a>
      <a class="bottom-nav__link" href="02-seat-arrangement.html"><i class="icon i-map" aria-hidden="true"></i><span>Map</span></a>
      <a class="bottom-nav__link" href="06-profile.html" aria-current="page"><i class="icon i-user" aria-hidden="true"></i><span>Profile</span></a>
    </nav>
  </div>
</body>
</html>
