<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan QR code · Study Spaces</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../base.css">
  <script src="../base.js"></script>
</head>
<body>
  <div class="app">
    <div class="camera">
      <div class="camera__top">
        <a class="icon-button" href="03-reservation.html" aria-label="Back to your reservation"><i class="icon i-back"></i></a>
        <h1 class="sr-only">Scan QR code</h1>
        <button class="icon-button" type="button" data-toggle aria-pressed="false" aria-label="Flashlight"><i class="icon i-flashlight"></i></button>
      </div>

      <div class="camera__body">
        <a class="scan" href="05-session.html" aria-label="Scan frame. Activate to simulate scanning the QR code on your table"></a>
        <div class="stack stack--tight">
          <p class="t-title">Scan the QR code on your table</p>
          <p class="t-small t-muted">Seat 14 · HG E 41</p>
        </div>
      </div>

      <div class="camera__foot">
        <div class="notice notice--danger" role="alert" data-if-error hidden>
          <i class="icon i-alert"></i>
          <div class="notice__text">
            <p class="notice__title">You don't seem to be at this seat</p>
            <p class="t-small t-muted">Move closer to seat 14 and try again.</p>
            <div class="notice__actions"><a class="btn btn--secondary" href="04-qr-scan.html">Try again</a></div>
          </div>
        </div>
        <p class="t-small t-muted">Mock: tap the frame to scan · <a href="04-qr-scan.html?error=1">show the error state</a></p>
      </div>
    </div>
  </div>
</body>
</html>
