<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile · Study Spaces</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../base.css">
  <script src="../base.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <a class="icon-button" href="01-home.html" aria-label="Back to home"><i class="icon i-back"></i></a>
      <h1 class="app-header__title">Profile</h1>
      <button class="icon-button theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to light theme">
        <i class="icon i-sun"></i><i class="icon i-moon"></i>
      </button>
    </header>

    <main class="app__main">
      <section class="card" aria-label="Your account">
        <div class="row" style="gap: var(--sp-4)">
          <span class="avatar avatar--lg" aria-hidden="true">AM</span>
          <div class="grow stack stack--tight">
            <p class="t-heading">Anna Meier</p>
            <p class="t-small t-muted">anna.meier@student.ethz.ch</p>
          </div>
        </div>
      </section>

      <h2 class="t-label">Notifications</h2>
      <section class="card" aria-label="Notification settings">
        <label class="toggle-row">Check-in reminder <input class="toggle" type="checkbox" role="switch" checked></label>
        <label class="toggle-row">Extension windows <input class="toggle" type="checkbox" role="switch" checked></label>
        <label class="toggle-row">Seat freed early <input class="toggle" type="checkbox" role="switch" checked></label>
      </section>
    </main>
  </div>
</body>
</html>
