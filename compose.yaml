services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: hackathon
      POSTGRES_USER: hackathon
      POSTGRES_PASSWORD: hackathon
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackathon -d hackathon"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      AUTH_MODE: ${AUTH_MODE:-demo}
      DATABASE_URL: postgresql+psycopg://hackathon:hackathon@db:5432/hackathon
      CORS_ORIGINS: '["http://localhost:5173", "http://127.0.0.1:5173"]'
      MAP_FLOORS_DIR: /app/floors
      MAP_CACHE_DIR: /app/.cache/campus-map
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./backend/tests:/app/tests
      - ./backend/alembic.ini:/app/alembic.ini
      - map_cache:/app/.cache
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        alembic upgrade head
        && python -m app.features.campus_map.importer --if-empty
        && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  map_cache:
