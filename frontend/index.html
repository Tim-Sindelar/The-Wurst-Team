<!doctype html>
<html lang="en" data-mantine-color-scheme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Study Spaces</title>
    <meta
      name="description"
      content="Find, book and check in to ETH study spaces."
    />
    <meta name="theme-color" content="#121212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Study Spaces" />
    <!-- Behind the organisers' login proxy the manifest needs the session cookie. -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
      crossorigin="use-credentials"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap"
    />
    <script>
      /* Apply the saved colour scheme before the first paint. */
      try {
        const scheme = localStorage.getItem('mantine-color-scheme-value');
        if (scheme === 'light' || scheme === 'dark')
          document.documentElement.setAttribute(
            'data-mantine-color-scheme',
            scheme,
          );
      } catch {
        /* storage blocked: stay dark */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
