name: Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  authorize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - id: permission
        name: Require repository write access for PRs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$PR_AUTHOR/permission" --jq .permission 2>/dev/null || true)
          case "$permission" in
            admin|maintain|write) echo 'allowed=true' >> "$GITHUB_OUTPUT" ;;
            *) echo 'allowed=false' >> "$GITHUB_OUTPUT"; echo 'PR CI requires repository write access.' ;;
          esac

  checks:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true' && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: hackathon_test
          POSTGRES_USER: hackathon
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hackathon -d hackathon_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      APP_BASE_PATH: ${{ github.event_name == 'pull_request' && format('/pr/{0}/', github.event.pull_request.number) || '/' }}
      DATABASE_URL: postgresql+psycopg://hackathon:ci_test_only@localhost:5432/hackathon_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
      - name: Check backend
        working-directory: backend
        run: |
          uv sync --locked
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked pytest
      - name: Check deployment files
        run: |
          bash -n deploy/*.sh deploy/tests/*.sh
          node --test .github/scripts/*.test.mjs
          POSTGRES_PASSWORD=ci_test_only IMAGE_TAG="$GITHUB_SHA" docker compose -f deploy/compose.yaml config --quiet
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Set geodata refresh week
        id: geodata
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          build-args: |
            INSTALL_DEV=false
            GEODATA_CACHE_WEEK=${{ steps.geodata.outputs.week }}
          tags: wurst-backend:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build web image and test deployment images
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --build-arg "APP_BASE_PATH=$APP_BASE_PATH" -f frontend/Dockerfile -t "wurst-web:$GITHUB_SHA" .
          docker run --rm --entrypoint caddy "wurst-web:$GITHUB_SHA" validate --config /etc/caddy/Caddyfile
          bash deploy/tests/integration.sh "$GITHUB_SHA" "$APP_BASE_PATH"
      - name: Package tested images
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/release"
          cp deploy/*.yaml deploy/*.sh deploy/GatewayCaddyfile "$RUNNER_TEMP/release/"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/release/SHA"
          docker save "wurst-backend:$GITHUB_SHA" "wurst-web:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/release/images.tar.gz"
          cd "$RUNNER_TEMP/release"
          sha256sum *.yaml *.sh GatewayCaddyfile SHA images.tar.gz > SHA256SUMS
      - name: Upload verified release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-release
          path: ${{ runner.temp }}/release/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  deploy:
    needs: [authorize, checks]
    if: needs.authorize.outputs.allowed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://02.hackathon.ethz.ch
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '02-direct.viscon-hackathon.ch' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'viscon' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download verified release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-release
          path: ${{ runner.temp }}/release
      - name: Verify release checksum
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum --check SHA256SUMS
          [[ "$(cat SHA)" == "$GITHUB_SHA" ]]
      - uses: ./.github/actions/deploy-ssh
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          host: ${{ env.DEPLOY_HOST }}
          user: ${{ env.DEPLOY_USER }}
          port: ${{ env.DEPLOY_PORT }}
      - name: Upload and deploy over SSH
        run: |
          set -euo pipefail
          release_id="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remote_dir="/home/$DEPLOY_USER/wurst/releases/$release_id"
          ssh -F "$RUNNER_TEMP/deploy-ssh/config" deployment "umask 077; mkdir -p '$remote_dir'"
          scp -F "$RUNNER_TEMP/deploy-ssh/config" "$RUNNER_TEMP/release/"* "deployment:$remote_dir/"
          ssh -F "$RUNNER_TEMP/deploy-ssh/config" deployment \
            "timeout 1200 bash '$remote_dir/deploy.sh' '$GITHUB_SHA'"
          printf 'Deployed `%s` to https://02.hackathon.ethz.ch\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy-ssh"

  preview:
    needs: [authorize, checks]
    if: needs.authorize.outputs.allowed == 'true' && github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: https://02.hackathon.ethz.ch/pr/${{ github.event.pull_request.number }}/
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'viscon' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_URL: https://02.hackathon.ethz.ch/pr/${{ github.event.pull_request.number }}/
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-release
          path: ${{ runner.temp }}/release
      - name: Verify release checksum
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum --check SHA256SUMS
          [[ "$(cat SHA)" == "$GITHUB_SHA" ]]
      - uses: ./.github/actions/deploy-ssh
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          host: ${{ vars.DEPLOY_HOST || '02-direct.viscon-hackathon.ch' }}
          user: ${{ env.DEPLOY_USER }}
          port: ${{ vars.DEPLOY_PORT || '22' }}
      - name: Deploy PR preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          # A PR may have closed or changed while checks were running.
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.state + " " + .head.sha')
          [[ "$current" == "open $PR_HEAD_SHA" ]] || { echo 'Preview run is stale or the PR is closed.'; exit 1; }
          remote_dir="/home/$DEPLOY_USER/wurst/previews/pr-$PR_NUMBER/releases/$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -F "$RUNNER_TEMP/deploy-ssh/config" deployment "umask 077; mkdir -p '$remote_dir'"
          scp -F "$RUNNER_TEMP/deploy-ssh/config" "$RUNNER_TEMP/release/"* "deployment:$remote_dir/"
          ssh -F "$RUNNER_TEMP/deploy-ssh/config" deployment "timeout 1200 bash '$remote_dir/deploy.sh' '$GITHUB_SHA' '$PR_NUMBER'"
          printf 'Preview: %s\n' "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Create or update preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_STATE: ready
        run: node .github/scripts/preview-comment.mjs
      - name: Remove temporary credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy-ssh"

  cleanup-preview:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true' && github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    environment: preview
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'viscon' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/deploy-ssh
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          host: ${{ vars.DEPLOY_HOST || '02-direct.viscon-hackathon.ch' }}
          user: ${{ env.DEPLOY_USER }}
          port: ${{ vars.DEPLOY_PORT || '22' }}
      - name: Remove PR preview and its data
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          remote_dir="/home/$DEPLOY_USER/wurst/actions/cleanup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -F "$RUNNER_TEMP/deploy-ssh/config" deployment "umask 077; mkdir -p '$remote_dir'"
          scp -F "$RUNNER_TEMP/deploy-ssh/config" deploy/cleanup-preview.sh deploy/gateway.sh deploy/gateway.compose.yaml deploy/GatewayCaddyfile "deployment:$remote_dir/"
          ssh -F "$RUNNER_TEMP/deploy-ssh/config" deployment "timeout 600 bash '$remote_dir/cleanup-preview.sh' '/home/$DEPLOY_USER/wurst' '$PR_NUMBER'"
      - name: Update preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_STATE: removed
        run: node .github/scripts/preview-comment.mjs
      - name: Remove temporary credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy-ssh"
